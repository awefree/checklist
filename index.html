<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { background: #1a1a2e; color: #eee; font-family: sans-serif;
         display: flex; justify-content: center; align-items: center;
         height: 100vh; margin: 0; }
  #clock { font-size: 4rem; }
  #list { display: none; font-size: 1.8rem; text-align: left; }
  #list label { display: block; margin: 0.5em 0; }
</style>
</head>
<body>
  <div id="clock">--:--</div>
  <div id="list">
    <h2>Morning Checklist</h2>
    <label><input type="checkbox"> Make coffee</label>
    <label><input type="checkbox"> Check email</label>
    <label><input type="checkbox"> Review schedule</label>
    <label><input type="checkbox"> Take meds</label>
  </div>
<script>
  var showAt = 7;    // hour (24h) when list appears
  var showMin = 0;   // minute
  function tick() {
    var now = new Date();
    var h = now.getHours(), m = now.getMinutes();
    document.getElementById('clock').textContent =
      ((h % 12) || 12) + ':' + (m < 10 ? '0' : '') + m +
      (h >= 12 ? ' PM' : ' AM');
    if (h > showAt || (h == showAt && m >= showMin)) {
      document.getElementById('list').style.display = 'block';
    }
  }
  setInterval(tick, 1000);
  tick();
</script>
</body>
</html>
