<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { background: #1a1a2e; color: #eee; font-family: sans-serif;
         display: flex; justify-content: center; align-items: center;
         height: 100vh; margin: 0; }
  #list { display: none; font-size: 2.5rem; text-align: left; }
  #list h2 { font-size: 3rem; margin-bottom: 1em; }
  #list label { display: block; margin: 1em 0; color: red; cursor: pointer; }
  #list input { width: 1.5rem; height: 1.5rem; }
</style>
</head>
<body>
  <div id="list">
    <h2>Morning Checklist</h2>
    <div id="items"></div>
  </div>
<script>
  var showAt = 7;
  var showMin = 0;
  var hideAt = 21;

  function tick() {
    var now = new Date();
    var h = now.getHours(), m = now.getMinutes();
    if (h >= hideAt) {
      document.getElementById('list').style.display = 'none';
    } else if (h > showAt || (h == showAt && m >= showMin)) {
      document.getElementById('list').style.display = 'block';
    }
  }
  setInterval(tick, 1000);
  tick();

  fetch('list.txt')
    .then(function(r) { return r.text(); })
    .then(function(text) {
      var lines = text.split('\n').filter(function(l) { return l.trim(); });
      var container = document.getElementById('items');
      var saved = JSON.parse(localStorage.getItem('checks') || '{}');

      lines.forEach(function(item, i) {
        var label = document.createElement('label');
        var box = document.createElement('input');
        box.type = 'checkbox';
        if (saved[i]) { box.checked = true; label.style.color = 'green'; }
        box.addEventListener('change', function() {
          var state = JSON.parse(localStorage.getItem('checks') || '{}');
          state[i] = box.checked;
          localStorage.setItem('checks', JSON.stringify(state));
          label.style.color = box.checked ? 'green' : 'red';
        });
        label.appendChild(box);
        label.appendChild(document.createTextNode(' ' + item));
        container.appendChild(label);
      });
    });
</script>
</body>
</html>
