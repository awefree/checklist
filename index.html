<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { background: #1a1a2e; color: #eee; font-family: sans-serif;
         display: flex; justify-content: center; align-items: center;
         height: 100vh; margin: 0; }
  #list { display: none; font-size: 2.5rem; text-align: left; }
  #list h2 { font-size: 3rem; margin-bottom: 1em; }
  #list label { display: block; margin: 1em 0; color: red;
                cursor: pointer; }
  #list input { width: 1.5rem; height: 1.5rem; }
</style>
</head>
<body>
  <div id="list">
    <h2>Morning Checklist</h2>
    <label><input type="checkbox"> Make coffee</label>
    <label><input type="checkbox"> Check email</label>
    <label><input type="checkbox"> Review schedule</label>
    <label><input type="checkbox"> Take meds</label>
  </div>
<script>
  var showAt = 7;
  var showMin = 0;
  var hideAt = 21;

  function tick() {
    var now = new Date();
    var h = now.getHours(), m = now.getMinutes();
    if (h >= hideAt) {
      document.getElementById('list').style.display = 'none';
    } else if (h > showAt || (h == showAt && m >= showMin)) {
      document.getElementById('list').style.display = 'block';
    }
  }
  setInterval(tick, 1000);
  tick();

  var boxes = document.querySelectorAll('input[type=checkbox]');
  for (var i = 0; i < boxes.length; i++) {
    boxes[i].addEventListener('change', function() {
      this.parentElement.style.color = this.checked ? 'green' : 'red';
    });
  }
</script>
</body>
</html>
